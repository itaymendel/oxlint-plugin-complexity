name: Publish

# Publishes the package to npm when a version tag (vX.Y.Z) is pushed.
# Auth uses npm trusted publishing (OIDC) — no NPM_TOKEN secret required.
# Configure the trusted publisher once at:
#   https://www.npmjs.com/package/oxlint-plugin-complexity/access
#   -> Trusted Publishers -> GitHub Actions
#   repo: itaymendel/oxlint-plugin-complexity, workflow: publish.yml

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # OIDC token for npm trusted publishing + provenance
      contents: write # create the GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # registry-url is required for trusted publishing: it points npm at
          # the registry to perform the OIDC token exchange. No NODE_AUTH_TOKEN
          # is set, so npm uses OIDC rather than a stored token.
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check types
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag: $TAG_VERSION  package.json: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Upgrade npm for trusted publishing
        # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 ships with npm 10.x.
        run: |
          npm install -g npm@latest
          echo "node $(node -v)"
          echo "npm  $(npm -v)"
          node -e 'const [maj,min]=process.versions.node.split(".").map(Number); if (maj<22 || (maj===22 && min<14)) { console.error("Node >= 22.14.0 required for trusted publishing"); process.exit(1); }'
          NPM_VER="$(npm -v)"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11 || (a===11 && (b<5 || (b===5 && c<1)))) { console.error("npm >= 11.5.1 required for trusted publishing, got "+process.argv[1]); process.exit(1); }' "$NPM_VER"

      - name: Publish to npm
        run: |
          # setup-node (with registry-url) exports a placeholder NODE_AUTH_TOKEN
          # and writes `_authToken=${NODE_AUTH_TOKEN}` into .npmrc. That bogus
          # token shadows OIDC, so npm tries token auth and gets a 404. Unset it
          # so the token resolves empty and npm uses the OIDC trusted-publishing
          # exchange instead.
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract this version's section from CHANGELOG.md (between its heading and the next).
          NOTES="$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { flag=1; next }
            /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md)"
          if [ -z "$NOTES" ]; then
            NOTES="Release $GITHUB_REF_NAME"
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$NOTES"
